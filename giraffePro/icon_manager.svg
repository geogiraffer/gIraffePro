     xmlns:xlink="http://www.w3.org/1999/xlink"
     version="1.2"
     baseProfile="tiny"
     width="128"
     height="128"
     viewBox="0 0 512 512"
     preserveAspectRatio="xMidYMid meet">

  <defs>

    <!-- =====================================================
         KREISBEGRENZUNG
         ===================================================== -->

    <clipPath id="circleClip">
      <circle cx="256" cy="256" r="231"/>
