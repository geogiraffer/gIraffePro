    <!-- =====================================================
         INNENBEREICH DER MASKE
         ===================================================== -->

    <mask id="insideMask"
          maskUnits="userSpaceOnUse"
          x="0"
          y="0"
          width="512"
          height="512">

      <rect x="0"
            y="0"
            width="512"
            height="512"
            fill="#000000"/>

      <use xlink:href="#maskPath"
           fill="none"
           stroke="#ffffff"
           stroke-width="114"
           stroke-linecap="round"/>

    </mask>


    <!-- =====================================================
         AUSSENBEREICH
         ===================================================== -->

    <mask id="outsideMask"
